name: android

# Builds an installable Android package (APK). The web app is wrapped with Capacitor; the recogniser model
# is packed inside, so the installed app needs no network at all.
on:
  push:
    branches: [main, 'arena/**']
    tags: ['v*']
    paths-ignore: ['**.md', 'tools/ci/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - name: Recogniser model (not stored in the repository)
        run: node tools/fetch-model.mjs
      - run: npm run build
      - name: Create the Android project
        run: |
          npx cap add android
          npx cap sync android
      - name: Configure camera, version and persistent APK signing
        id: android-config
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: node tools/configure-android.mjs
      - name: Build update-safe signed APK
        if: steps.android-config.outputs.signed == 'true'
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon --console=plain
      - name: Build debug APK while release signing is not configured
        if: steps.android-config.outputs.signed != 'true'
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --console=plain
      - name: Collect release-signed APK
        if: steps.android-config.outputs.signed == 'true'
        run: cp android/app/build/outputs/apk/release/app-release.apk pocherk.apk && ls -la pocherk.apk
      - name: Collect debug APK (not suitable for update installs)
        if: steps.android-config.outputs.signed != 'true'
        run: cp android/app/build/outputs/apk/debug/app-debug.apk pocherk.apk && ls -la pocherk.apk
      - uses: actions/upload-artifact@v4
        with:
          name: pocherk-apk-${{ steps.android-config.outputs.signed == 'true' && 'signed' || 'debug' }}
          path: pocherk.apk
      - name: Publish versioned APK release or latest main pre-release
        if: steps.android-config.outputs.signed == 'true' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'apk-latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && format('Почерк для Android {0}', github.ref_name) || 'Почерк для Android: последняя сборка' }}
          prerelease: true
          make_latest: false
          files: pocherk.apk
          body: |
            Версия ${{ steps.android-config.outputs.versionName }} (versionCode ${{ steps.android-config.outputs.versionCode }}), коммит ${{ github.sha }}.
            APK подписан постоянным ключом проекта; обновление поверх предыдущей release-версии сохраняет локальную библиотеку.
            Скачайте `pocherk.apk` на телефон и откройте его; Android попросит разрешить установку из этого источника.
      - name: Explain why the public release was not replaced
        if: steps.android-config.outputs.signed != 'true'
        run: echo 'APK built as a CI debug artifact only. Configure the four ANDROID_* signing secrets before publishing an update-safe APK.'
      - name: Keep signed branch builds as artifacts until merged or tagged
        if: steps.android-config.outputs.signed == 'true' && github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/v')
        run: echo 'Signed APK artifact created, but only main and version tags publish releases.'
