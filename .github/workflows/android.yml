name: android

# Собирает Android-приложение (Capacitor) и подписывает его постоянным ключом:
# общий ключ проекта android-signing/pocherk.p12 либо личный keystore из
# секретов ANDROID_* (см. README, раздел «Подпись Android»).
# Одинаковая подпись у всех версий => APK ставится обновлением поверх старой.
on:
  push:
    branches: [main, 'arena/**']
    tags: ['v*']
    paths-ignore: ['**.md']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run build
      - name: Create the Android project
        run: |
          npx cap add android
          npx cap sync android
      - name: Configure version and signing
        id: android-config
        env:
          VERSION_CODE: ${{ github.run_number }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: node tools/configure-android.mjs
      - name: Build signed release APK
        if: steps.android-config.outputs.signed == 'true'
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon --console=plain
      - name: Build debug APK (no signing secrets configured)
        if: steps.android-config.outputs.signed != 'true'
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --console=plain
      - name: Collect APK
        run: |
          if [ "${{ steps.android-config.outputs.signed }}" = "true" ]; then
            cp android/app/build/outputs/apk/release/app-release.apk pocherk.apk
          else
            cp android/app/build/outputs/apk/debug/app-debug.apk pocherk.apk
          fi
          ls -la pocherk.apk
      - uses: actions/upload-artifact@v4
        with:
          name: pocherk-apk-${{ steps.android-config.outputs.signing }}
          path: pocherk.apk
      - name: Publish APK release
        if: ${{ steps.android-config.outputs.signed == 'true' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'apk-latest' }}
          name: "${{ startsWith(github.ref, 'refs/tags/v') && format('Почерк — буквы {0}', github.ref_name) || 'Почерк — буквы: последняя сборка' }}"
          prerelease: true
          make_latest: false
          files: pocherk.apk
          body: |
            Версия ${{ steps.android-config.outputs.versionName }} (versionCode ${{ steps.android-config.outputs.versionCode }}), коммит ${{ github.sha }}.
            Подпись: ${{ steps.android-config.outputs.signing == 'common' && 'общий ключ проекта — APK ставится обновлением поверх предыдущих версий' || 'личный keystore из секретов' }}.
      - name: Publish tagged APK if signing key is missing
        if: ${{ steps.android-config.outputs.signed != 'true' && startsWith(github.ref, 'refs/tags/v') }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "${{ format('Почерк — буквы {0} (debug-подпись)', github.ref_name) }}"
          prerelease: true
          make_latest: false
          files: pocherk.apk
          body: |
            Версия ${{ steps.android-config.outputs.versionName }} (versionCode ${{ steps.android-config.outputs.versionCode }}), коммит ${{ github.sha }}.
            Постоянный ключ не найден: APK подписан временным debug-ключом GitHub Actions.
            Такая сборка НЕ обновляется поверх APK с другим сертификатом — потребуется переустановка с потерей данных.
            Проверьте наличие android-signing/pocherk.p12 или секретов ANDROID_* (см. README).
