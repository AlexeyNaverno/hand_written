name: relay-models

# Brings model weights into the development sandbox, which cannot reach
# release assets or Hugging Face. The result goes to refs/relay/models,
# which is not a branch and can be deleted at any time.
on:
  push:
    paths:
      - tools/ci/relay.json
      - tools/ci/relay.py
      - .github/workflows/relay-models.yml

permissions:
  contents: write

jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Download files
        run: python3 tools/ci/relay.py
      - name: Publish to refs/relay/models
        run: |
          cd relay_out
          git init -q
          git config user.name "relay"
          git config user.email "relay@users.noreply.github.com"
          git add -A
          git commit -qm "relay $(date -u +%FT%TZ)"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" HEAD:refs/relay/models
